# Conference Room Quality Assessor — config

# Paths
paths:
  images_dir: "data/images"
  labels_csv: "data/labels.csv"               # AI-rated labels (see data/rating_rubric.md)
  detections_dir: "outputs/detections"
  features_csv: "features/features.csv"
  embeddings_npz: "features/clip_embeddings.npz"
  models_dir: "models"
  outputs_dir: "outputs"

# Detection (YOLOv8)
detection:
  model_name: "yolov8n.pt"          # nano model — fast & good enough
  confidence_threshold: 0.30        # minimum confidence to accept detection
  iou_threshold: 0.45               # NMS IOU threshold
  image_size: 640                   # inference resolution
  device: ""                        # "" = auto (CPU/GPU), "cpu", "cuda:0"
  relevant_classes:                 # COCO classes we care about
    - chair
    - dining table
    - handbag
    - backpack
    - bottle
    - cup
    - laptop
    - person
    - cell phone
    - remote
    - book
    - keyboard
    - mouse
    - tv

# Feature engineering
features:
  clutter_classes:
    - handbag
    - backpack
    - bottle
    - cup
    - laptop
    - cell phone
    - remote
    - book
    - keyboard
    - mouse
  furniture_classes:                # fixtures: never counted as clutter / floor / table items
    - chair
    - dining table
    - tv
  floor_region_fraction: 0.45       # bottom fraction considered "floor"

# Image embeddings (main model input)
embedding:
  model_name: "openai/clip-vit-base-patch32"
  batch_size: 16

# Model training
model:
  target_column: "overall_score"    # primary target: charts, OOF predictions, CLIP comparison
  targets:                          # every target gets its own models
    - overall_score
    - cleanliness_score
    - chair_alignment_score
    - clutter_score
  default_model: "clip_ridge"       # used by evaluate.py and the Streamlit app
  ridge_alphas: [0.01, 0.1, 1, 10, 100, 1000, 10000]
  cv_folds: 5                       # K-fold CV (repeated) — replaces the old single 80/20 split
  cv_repeats: 5
  random_state: 42
  xgboost:
    n_estimators: 200
    max_depth: 4
    learning_rate: 0.08
    subsample: 0.8
    colsample_bytree: 0.8
    min_child_weight: 2
  random_forest:
    n_estimators: 200
    max_depth: 6
    random_state: 42

# CLIP baseline
clip:
  model_name: "openai/clip-vit-base-patch32"
  # Score = mean(positive logits) − mean(negative logits); ensembles reduce single-prompt noise
  positive_prompts:
    - "a clean, organized, professional conference room with neatly arranged chairs and a tidy table"
    - "a photo of a tidy, empty meeting room ready for a meeting"
    - "a conference room with chairs pushed in and a clear table"
    - "a neat and well-kept office meeting room"
  negative_prompts:
    - "a messy, cluttered, disorganized conference room with chairs out of place and objects scattered"
    - "a photo of a meeting room with papers, cups and trash left on the table"
    - "a conference room with chairs scattered around after a meeting"
    - "an untidy, dirty office meeting room"

# Visualization (bounding box colors for evaluate.py)
visualization:
  bbox_thickness: 2
  font_scale: 0.55
  score_bar_figsize: [10, 4]
  colors:                           # BGR (OpenCV format)
    chair: [0, 200, 100]
    dining table: [100, 180, 255]
    clutter: [0, 60, 220]
    person: [255, 140, 0]
    default: [180, 180, 180]
