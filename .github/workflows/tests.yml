name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      # The tests never load YOLO or the image model, so torch/ultralytics/transformers are not needed here.
      - name: Install test dependencies
        run: |
          pip install "numpy~=2.2" "pandas~=2.3" "scikit-learn~=1.7.2" "scipy~=1.15" "matplotlib~=3.10" \
                      "xgboost~=3.2" "joblib~=1.5" "pyyaml~=6.0" opencv-python-headless Pillow "pytest~=9.1"
      - name: Run tests
        run: python -m pytest tests -q
